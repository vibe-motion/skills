// ---------- kit ----------
const rnd = (() => { let s = 21; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const put = (m, x, y, z, ry = 0) => { m.position.set(x, y, z); m.rotation.y = ry; m.castShadow = m.receiveShadow = true; G.add(m); return m; };

const sph = (r, m, x, y, z, sx = 1, sy = 1, sz = 1) => { const o = put(new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m), x, y, z); o.scale.set(sx, sy, sz); return o; };
const group = (fn, x, y, z, ry = 0) => { const g = new THREE.Group(), p = G; G = g; fn(); G = p; g.position.set(x, y, z); g.rotation.y = ry; g.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; }); G.add(g); return g; };
function canvasTex(w, h, paint, rep) { const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);

// ---------- product labels (printed in code: real Japanese text, crisp) ----------
const BRAND = { drink: ["緑茶", "麦茶", "ほうじ茶", "サイダー", "天然水", "コーヒー", "オレンジ", "スポーツ"], can: ["ツナ", "コーン", "トマト", "みかん", "さば", "ビール", "コーラ"],
  box: ["コーンフレーク", "クッキー", "チョコ", "カレー", "シチュー", "ビスケット", "グラノーラ"], bag: ["ポテト", "せんべい", "えびせん", "ポップコーン", "あられ", "スナック"],
  cup: ["ラーメン", "うどん", "そば", "焼きそば", "みそ汁"], bottle: ["醤油", "みりん", "ソース", "酢", "ドレッシング"] };
const BG = ["#D8322A", "#F2C230", "#1F8A4C", "#2B55B8", "#F4F3EE", "#F07E26", "#7A4FB0", "#1C2A55", "#E85A8A", "#2FA9C9", "#8B5A2B", "#111"];
const ink = (bg) => { const c = new THREE.Color(bg); return c.r * .3 + c.g * .59 + c.b * .11 > .55 ? "#1b1b1b" : "#ffffff"; };
function label(kind, i) {   // returns a texture for one product design
  const bg = BG[(i * 5 + kind.length) % BG.length], fg = ink(bg), word = BRAND[kind][i % BRAND[kind].length];
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    const acc = BG[(i * 3 + 4) % BG.length]; g.fillStyle = acc; g.globalAlpha = .9;

  can: new THREE.CylinderGeometry(.033, .033, .12, 28),

};

// a shelf run: blocks of identical products (real merchandising), a price-tag rail with printed tags
function shelfRun(len, face, kinds) {

    const n = Math.min(facings, Math.floor((len / 2 - .05 - z) / (w + .006))); if (n < 1) break;

    const im = new THREE.InstancedMesh(GEO[it.k], productMat(it.k, it.v), it.n * 2), m4 = new THREE.Matrix4(), q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, face * Math.PI / 2, 0));

      m4.compose(new THREE.Vector3(x + face * (.12 - r * .11), yy, it.z0 + it.w / 2 + i * (it.w + .006)), q, new THREE.Vector3(1, 1, 1)); im.setMatrixAt(c++, m4); }

    for (let k = 0; k < 14; k++) { const px = 40 + k * 146; g.fillStyle = k % 4 === 0 ? "#F2C230" : "#ffffff"; g.fillRect(px, 6, 118, 52); g.strokeStyle = "#999"; g.lineWidth = 2; g.strokeRect(px, 6, 118, 52);
      txt(g, pick(["¥98", "¥128", "¥158", "¥198", "¥248", "¥298", "¥88"]), px + 59, 26, 30, k % 4 === 0 ? "#D8322A" : "#1b1b1b"); txt(g, "税込", px + 59, 50, 14, "#555", 600); } });

  g.strokeStyle = "rgba(0,0,0,.12)"; g.lineWidth = 2; for (let k = 0; k <= n; k++) { g.beginPath(); g.moveTo(k * w / n, 0); g.lineTo(k * w / n, h); g.stroke(); g.beginPath(); g.moveTo(0, k * h / n); g.lineTo(w, k * h / n); g.stroke(); } }, [20, 18]);
const floorM = new THREE.MeshStandardMaterial({ map: floorT, roughness: .22, envMapIntensity: .8 });
const fl = new THREE.Mesh(new THREE.PlaneGeometry(80, 70), floorM); fl.rotation.x = -Math.PI / 2; fl.position.set(0, 0, -9); fl.receiveShadow = true; scene.add(fl);
box(80, .004, .1, mat("#F2C230"), 0, .002, 3.05); box(80, .004, .1, mat("#F2C230"), 0, .002, -3.05);
for (let k = 0; k < 7; k++) box(4.6, .004, .42, mat("#F4F3EE", { roughness: .4 }), -.2, .003, 2.4 - k * .82);   // floor markings in the cross aisle

const ce = new THREE.Mesh(new THREE.PlaneGeometry(80, 70), new THREE.MeshStandardMaterial({ map: ceilT, roughness: .9 })); ce.rotation.x = Math.PI / 2; ce.position.set(0, 6.6, -9); scene.add(ce);
const panelM = new THREE.MeshStandardMaterial({ color: "#ffffff", emissive: "#ffffff", emissiveIntensity: 1.3 });
for (const x of [-2.2, 0, 2.2, -6, 6]) for (let z = 5; z > END; z -= 2.4) { const p = new THREE.Mesh(new THREE.PlaneGeometry(.55, 1.15), panelM); p.rotation.x = Math.PI / 2; p.position.set(x, 6.595, z); scene.add(p); }
for (let z = 4; z > END; z -= 4.8) for (const x of [-1.1, 1.1]) cyl(.025, .025, .06, METAL(), x, 6.57, z, 10);

// back wall: department signs, a fresh-food chiller run, a deli counter
group(() => {
  box(40, 6.6, .3, mat("#E8E5DC", { roughness: .85 }), 0, 3.3, -.15);
  const ban = canvasTex(2048, 256, (g, W, H) => { g.fillStyle = "#1F8A4C"; g.fillRect(0, 0, W, H); txt(g, "毎日安い！  新鮮・おいしい  ほっとマート", W / 2, H / 2, 120, "#fff"); g.fillStyle = "#F2C230"; g.fillRect(0, H - 24, W, 24); });
  const bn = new THREE.Mesh(new THREE.PlaneGeometry(18, 2.25), new THREE.MeshStandardMaterial({ map: ban, roughness: .5 })); bn.position.set(-4.6, 5.35, .02); G.add(bn);   // store banner high on the back wall
  const dept = [["鮮魚", "#2B55B8"], ["精肉", "#D8322A"], ["惣菜", "#F07E26"], ["青果", "#1F8A4C"], ["日配", "#2FA9C9"]];
  dept.forEach(([w, c], i) => { const t = canvasTex(512, 160, (g, W, H) => { g.fillStyle = c; g.fillRect(0, 0, W, H); txt(g, w, W / 2, H / 2, 104, "#fff"); });
    const s = new THREE.Mesh(new THREE.PlaneGeometry(2.4, .75), new THREE.MeshStandardMaterial({ map: t, roughness: .5, emissive: "#ffffff", emissiveMap: t, emissiveIntensity: .25 })); s.position.set(-9.6 + i * 4.8, 3.75, .02); G.add(s); });
  // open chillers: dark interior, glowing top strip, packed trays
  for (let k = -7; k <= 7; k++) { const x = k * 1.32;
    box(1.3, 2.0, .9, mat("#E9EEF2", { roughness: .4 }), x, 1.0, .45); box(1.2, 1.5, .02, mat("#22324F"), x, 1.15, .6);
    box(1.2, .05, .2, mat("#ffffff", { emissive: "#ffffff", emissiveIntensity: 1.5 }), x, 1.95, .8);
    for (let s = 0; s < 4; s++) for (let c = 0; c < 6; c++) { const k2 = pick(["can", "cup", "drink"]); const it = new THREE.Mesh(GEO[k2], productMat(k2, Math.floor(rnd() * 8))); it.position.set(x - .5 + c * .2, .55 + s * .38, .72); G.add(it); }
    box(1.3, .3, .9, mat("#B9BCC3", { roughness: .4 }), x, .15, .45); }
}, 4.6, 0, END);

// gondolas down both sides of the main aisle (aisle-facing side fully stocked), with header signs and price rails
function gondola(x, z0, z1, face, cat) {
  const len = z0 - z1, cz = (z0 + z1) / 2;
  group(() => {
    box(.12, 1.95, len, mat("#D4D6DD", { roughness: .5 }), -face * .27, .98, 0);              // back panel, behind the shelves
    box(.5, .04, len, mat("#BFC3CC", { roughness: .4 }), face * .02, 1.97, 0);                // top cap
    for (let s = 0; s < 5; s++) { const y = .16 + s * .38;
      box(.48, .025, len, METAL("#E3E5EA"), face * .04, y, 0);
      placeProducts(shelfRun(len, face, s > 3 ? ["bag", "box"] : s > 1 ? cat : ["drink", "bottle", "can"]), face * .04, y + .013, face);
      priceRail(len, face, face * .285, y - .01, 0); }
    box(.5, .12, len, mat("#6d7184"), face * .04, .06, 0);
    // category header board on top, facing the aisle
    const t = canvasTex(1024, 128, (g, W, H) => { g.fillStyle = "#1F8A4C"; g.fillRect(0, 0, W, H); txt(g, cat === ["cup"] ? "" : catName(cat), W / 2, H / 2, 74, "#fff"); });
    const hb = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(len, 6), .38), new THREE.MeshStandardMaterial({ map: t, roughness: .5 })); hb.position.set(face * .05, 2.2, 0); hb.rotation.y = face * Math.PI / 2; G.add(hb);

const catName = (c) => c.includes("cup") ? "インスタント食品" : c.includes("box") ? "お菓子・シリアル" : c.includes("bottle") ? "調味料" : "飲料";

let ci = 0;

for (const [z0, z1] of [[-3.4, -14], [-15.4, -24], [-25.4, END + 1]]) { box(1.0, 1.95, z0 - z1, mat("#D4D6DD"), -ROADW / 2 - 2.8, .98, (z0 + z1) / 2); box(1.0, 1.95, z0 - z1, mat("#D4D6DD"), ROADW / 2 + 2.8, .98, (z0 + z1) / 2); }
box(.3, 6.6, 60, mat("#E8E5DC"), -11, 3.3, -10); box(.3, 6.6, 60, mat("#E8E5DC"), 11, 3.3, -10);

endcap(-ROADW / 2 - .55, -2.9, "can"); endcap(ROADW / 2 + .55, -2.9, "box"); endcap(-ROADW / 2 - 2.8, -2.9, "cup"); endcap(ROADW / 2 + 2.8, -2.9, "bag");

    txt(g, pick(["飲料", "お菓子", "調味料", "麺類", "日用品"]), 350, H / 2 - 22, 58, "#fff"); txt(g, "AISLE", 350, H / 2 + 46, 30, "#BFE8CF", 700); });

}
let an = 1; for (const z of [3.3, -6.8, -14.6, -22.4, -30.2]) { column(-ROADW / 2 - .55, z, an); column(ROADW / 2 + .55, z, an + 1); an += 2; }

  const h = new THREE.Mesh(new THREE.TorusGeometry(.17, .01, 8, 24, Math.PI), mat("#2b2b2b", { roughness: .4 })); h.position.set(0, .29, 0); h.castShadow = true; G.add(h);
}, x, 0, z); g.scale.setScalar(s); return g; }
const CONES = []; for (let k = 0; k < 5; k++) CONES.push(basket(-2.6 + k * 1.36, 5.75, 1.9));
const coneZ = (k, lay) => 5.75 + (2.6 - k * .95 - 5.75) * lay;
